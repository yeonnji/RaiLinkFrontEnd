name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_SHIPPING_API_PATH: https://cloudrun-test-530608231336.asia-northeast3.run.app/api/Shipping/recommend
          VITE_HISTORY_SUMMARY_API_PATH: https://railink-run-530608231336.asia-northeast3.run.app/api/history/summary
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RAILINK_FRONT_HOSTING }}
          channelId: live
          projectId: railink-front-hosting
